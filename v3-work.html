<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yenhsing Cheng · Project</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Project case study by Yenhsing Cheng." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Spectral:ital,wght@1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="v3.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="v3head">
    <span class="v3head__label" id="projLabel" role="button" tabindex="0" aria-expanded="false">projects</span>
    <div class="v3head__main">
      <a href="v3.html" class="v3head__logo">Yenhsing Cheng</a>
      <nav class="v3head__nav">
        <a href="v3.html">work</a>
        <a href="v3.html#about">about / contact</a>
      </nav>
    </div>
  </header>

  <main class="case3" id="case"></main>

  <script src="v3.js"></script>
  <script>
    (function () {
      const esc = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      const params = new URLSearchParams(location.search);
      let id = params.get('p');
      if (!PROJECTS_V3[id]) id = ORDER_V3[0];
      const p = PROJECTS_V3[id];
      document.title = `Yenhsing Cheng · ${p.title}`;

      /* a coverPlaylist replaces the cover: the hero starts on its first clip and cycles */
      const hero = (p.coverPlaylist && p.coverPlaylist[0]) || HERO_OVERRIDE_V3[id] || p.cover;
      const site = SITES_V3[id] || '';

      const mediaOf = (src, alt) => isVidV3(src)
        ? `<video src="${src}" muted loop playsinline preload="metadata" data-lazyplay></video>`
        : `<img src="${src}" alt="${esc(alt) || esc(p.title)}" loading="lazy">`;
      const capOf = (f) => f.cap ? `<figcaption>${esc(f.cap)}</figcaption>` : '';
      const figInner = (f) => `<figure class="case3__figure">${mediaOf(f.src, f.cap)}${capOf(f)}</figure>`;
      const figWide = (f) => `<figure class="case3__figure case3__figure--wide reveal">${mediaOf(f.src, f.cap)}${capOf(f)}</figure>`;
      /* portrait video with still photos stacked on its left */
      const figDuo = (f) => `
        <div class="case3__duo${f.even ? ' case3__duo--even' : ''} reveal">
          <div class="case3__duo-left">${f.left.map((l) => figInner(l)).join('')}</div>
          <figure class="case3__figure case3__figure--portrait">${mediaOf(f.src, f.cap)}${capOf(f)}</figure>
        </div>`;

      /* hero */
      const heroHTML = `<div class="case3__hero${p.coverFit === 'contain' ? ' case3__hero--contain' : ''}">${isVidV3(hero)
        ? `<video src="${hero}" muted loop playsinline preload="metadata" data-lazyplay></video>`
        : `<img src="${hero}" alt="${esc(p.title)} — cover">`}</div>`;

      /* metadata row */
      const metaHTML = `
        <div class="case3__meta">
          <div class="case3__meta-left">
            <div class="case3__cat">${esc(p.cat)}</div>
            ${p.team && p.team !== '—' ? `<div class="case3__role">${esc(p.team)}</div>` : ''}
            ${p.award ? `<div class="case3__award">${esc(p.award)}</div>` : ''}
            ${p.role && p.role !== '—' ? `<div class="case3__role">${esc(p.role)}</div>` : ''}
          </div>
          <div class="case3__meta-main">
            <h1 class="case3__title">${esc(p.title)}</h1>
            <div class="case3__where">
              ${site ? `<span>${esc(site)}</span>` : ''}
              <span class="yr">${esc(p.year)}</span>
            </div>
          </div>
        </div>`;

      /* intro only — the long `body` essay is omitted to match v2's lean,
         gallery-first case template */
      let textHTML = '';
      if (p.intro) textHTML += `<p class="case3__intro reveal">${esc(p.intro)}</p>`;

      /* portrait-cover pages: info column on the left, the FULL portrait
         video on the right (never cropped by the hero band) */
      const topHTML = p.coverPortrait
        ? `
        <div class="case3__vtop">
          <div class="case3__vtop-info">
            <div class="case3__cat">${esc(p.cat)}</div>
            ${p.role && p.role !== '—' ? `<div class="case3__role">${esc(p.role)}</div>` : ''}
            <h1 class="case3__title">${esc(p.title)}</h1>
            <div class="case3__where">
              ${site ? `<span>${esc(site)}</span>` : ''}
              <span class="yr">${esc(p.year)}</span>
            </div>
            ${p.intro ? `<p class="case3__intro reveal">${esc(p.intro)}</p>` : ''}
          </div>
          <figure class="case3__vtop-media">
            <video src="${hero}" muted loop playsinline preload="metadata" data-lazyplay></video>
          </figure>
        </div>`
        : heroHTML + metaHTML + textHTML;

      /* essay */
      let essayHTML = '';
      if (p.layout === 'archive') {
        essayHTML = `
          <p class="case3__arch-intro reveal">${esc(p.introA)}</p>
          <div class="case3__arch-mockups reveal">${(p.mockups || []).map((m) => `<figure class="case3__figure">${mediaOf(m, p.title)}</figure>`).join('')}</div>
          <p class="case3__arch-intro reveal">${esc(p.introB)}</p>
          ${figWide({ src: p.longImg })}`;
      } else {
        const g = p.gallery || [];
        let buf = [];
        const flush = () => {
          for (let i = 0; i < buf.length; i += 2) {
            if (i + 1 < buf.length) essayHTML += `<div class="case3__pair reveal">${figInner(buf[i])}${figInner(buf[i + 1])}</div>`;
            else essayHTML += figWide(buf[i]);
          }
          buf = [];
        };
        g.forEach((f) => {
          if (f.left) { flush(); essayHTML += figDuo(f); }
          else if (f.wide) { flush(); essayHTML += figWide(f); }
          else buf.push(f);
        });
        flush();
      }
      essayHTML = `<section class="case3__essay">${essayHTML}</section>`;

      /* source code + README — only for projects carrying a `repo`. The README
         markdown is fetched live from GitHub raw (CORS-open) and rendered by the
         mini converter below, so this stays a single static file, no build step. */
      let repoHTML = '';
      if (p.repo) {
        repoHTML = `
          <section class="case3__repo" id="repoSec" hidden>
            <div class="case3__repo-head">
              <span class="case3__repo-label">Source code</span>
              <a class="case3__repo-link" id="repoLink" href="#" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
                <span id="repoName">github.com</span>
              </a>
            </div>
            <div class="case3__readme md" id="repoReadme"></div>
          </section>`;
      }

      /* prev / next */
      const n = ORDER_V3.length;
      const idx = ORDER_V3.indexOf(id);
      const prevId = ORDER_V3[(idx - 1 + n) % n];
      const nextId = ORDER_V3[(idx + 1) % n];
      const navHTML = `
        <nav class="case3__nav">
          <a class="prev" href="v3-work.html?p=${prevId}"><span class="dir">← Previous</span><span class="nm">${esc(PROJECTS_V3[prevId].title)}</span></a>
          <a class="next" href="v3-work.html?p=${nextId}"><span class="dir">Next →</span><span class="nm">${esc(PROJECTS_V3[nextId].title)}</span></a>
        </nav>`;

      document.getElementById('case').innerHTML = topHTML + essayHTML + repoHTML + navHTML;

      /* fetch + render the README for repo-backed projects */
      if (p.repo) {
        const m = /github\.com\/([^/]+)\/([^/#?]+)/.exec(p.repo);
        if (m) {
          const owner = m[1], name = m[2].replace(/\.git$/, '');
          const repoUrl = `https://github.com/${owner}/${name}`;
          const sec = document.getElementById('repoSec');
          document.getElementById('repoLink').href = repoUrl;
          document.getElementById('repoName').textContent = `github.com/${owner}/${name}`;
          sec.hidden = false;
          const readme = document.getElementById('repoReadme');
          const branches = ['main', 'master'];
          const tryBranch = (bi) => {
            if (bi >= branches.length) { sec.hidden = true; return; }
            const br = branches[bi];
            const rawBase = `https://raw.githubusercontent.com/${owner}/${name}/${br}/`;
            const blobBase = `${repoUrl}/blob/${br}/`;
            fetch(rawBase + 'README.md', { cache: 'no-cache' })
              .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
              .then((md) => { readme.innerHTML = renderMarkdown(md, rawBase, blobBase, repoUrl); })
              .catch(() => tryBranch(bi + 1));
          };
          tryBranch(0);
        }
      }

      /* portrait tech videos render at natural aspect, right-aligned */
      if (GROUPS_V3.tech.includes(CAT_V3[id])) {
        document.querySelectorAll('#case video').forEach((v) => {
          const mark = () => {
            if (v.videoHeight <= v.videoWidth) return;
            const fig = v.closest('.case3__figure');
            const hero = v.closest('.case3__hero');
            if (fig) fig.classList.add('case3__figure--portrait');
            else if (hero) hero.classList.add('case3__hero--portrait');
          };
          if (v.readyState >= 1) mark();
          else v.addEventListener('loadedmetadata', mark, { once: true });
        });
      }

      /* behaviours — the observer first: resumeHeroVideo must seek AFTER the
         clip-config listener it would otherwise be overwritten by */
      initVideoObserver();
      const resumedAt = resumeHeroVideo(p.coverPlaylist);
      initCoverPlaylist(p.coverPlaylist, resumedAt);
      initReveal();
      initProjectsIndex();

      /* keyboard ← → navigation */
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') location.href = `v3-work.html?p=${prevId}`;
        else if (e.key === 'ArrowRight') location.href = `v3-work.html?p=${nextId}`;
      });

      /* minimal Markdown → HTML — same converter as work.html: headings,
         paragraphs, bold/italic/inline-code, links, images, lists, blockquotes,
         rules, fenced code, and GFM pipe tables. Relative image/link paths
         resolve against the repo's raw/blob host. Deliberately dependency-free. */
      function renderMarkdown(md, rawBase, blobBase, repoUrl) {
        const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const resolveLink = (u) => {
          u = u.trim();
          if (/^(https?:|mailto:)/i.test(u)) return u;
          if (u[0] === '#') return repoUrl + u.toLowerCase();
          return blobBase + u.replace(/^\.?\//, '');
        };
        const resolveImg = (u) => {
          u = u.trim();
          if (/^https?:/i.test(u)) return u;
          return rawBase + u.replace(/^\.?\//, '');
        };
        const inline = (raw) => {
          let t = esc(raw);
          const code = [];
          t = t.replace(/`([^`]+)`/g, (mm, c) => { code.push(c); return '' + (code.length - 1) + ''; });
          t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (mm, a, u) => `<img src="${resolveImg(u)}" alt="${a}" loading="lazy">`);
          t = t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (mm, txt, u) => `<a href="${resolveLink(u)}" target="_blank" rel="noopener">${txt}</a>`);
          t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
          t = t.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
          t = t.replace(/(\d+)/g, (mm, i) => `<code>${code[+i]}</code>`);
          return t;
        };
        const cells = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
        const isTableSep = (l) => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.indexOf('-') > -1 && l.indexOf('|') > -1;

        const lines = md.replace(/\r\n/g, '\n').split('\n');
        let html = '', i = 0;
        while (i < lines.length) {
          let line = lines[i];
          if (!line.trim()) { i++; continue; }
          const fence = /^\s*(```|~~~)(.*)$/.exec(line);
          if (fence) {
            const mark = fence[1], lang = fence[2].trim();
            const buf = [];
            i++;
            while (i < lines.length && lines[i].indexOf(mark) === -1) { buf.push(lines[i]); i++; }
            i++;
            html += `<pre class="md-code${lang ? ' md-lang-' + lang.replace(/[^a-z0-9]/gi, '') : ''}"><code>${esc(buf.join('\n'))}</code></pre>`;
            continue;
          }
          if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += '<hr>'; i++; continue; }
          const h = /^(#{1,6})\s+(.*)$/.exec(line);
          if (h) { const n = h[1].length; html += `<h${n}>${inline(h[2].replace(/\s+#+\s*$/, ''))}</h${n}>`; i++; continue; }
          if (line.indexOf('|') > -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
            const head = cells(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') > -1) { rows.push(cells(lines[i])); i++; }
            const hasHead = head.some((c) => c !== '');
            html += '<div class="md-table-wrap"><table>';
            if (hasHead) html += '<thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead>';
            html += '<tbody>' + rows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
            html += '</table></div>';
            continue;
          }
          if (/^\s*>/.test(line)) {
            const buf = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
            html += `<blockquote>${inline(buf.join(' ').trim())}</blockquote>`;
            continue;
          }
          if (/^\s*[-*+]\s+/.test(line)) {
            const buf = [];
            while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*+]\s+/, '')); i++; }
            html += '<ul>' + buf.map((t) => `<li>${inline(t)}</li>`).join('') + '</ul>';
            continue;
          }
          if (/^\s*\d+\.\s+/.test(line)) {
            const buf = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; }
            html += '<ol>' + buf.map((t) => `<li>${inline(t)}</li>`).join('') + '</ol>';
            continue;
          }
          const buf = [];
          while (i < lines.length && lines[i].trim()
            && !/^\s*(```|~~~|#{1,6}\s|>|[-*+]\s|\d+\.\s)/.test(lines[i])
            && !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])
            && !(lines[i].indexOf('|') > -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
            buf.push(lines[i]); i++;
          }
          html += `<p>${inline(buf.join('\n')).replace(/\n/g, '<br>')}</p>`;
        }
        return html;
      }
    })();
  </script>
</body>

</html>
